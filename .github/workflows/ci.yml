name: CI

# Runs on request rather than on every push. The same three checks run locally
# with `npm run verify`, which is what the contributing guide asks for before
# opening a pull request.
#
# To run them on every push and pull request instead, add the triggers back:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#     workflow_dispatch:
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
