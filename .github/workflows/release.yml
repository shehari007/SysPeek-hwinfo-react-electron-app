name: Release

# Builds installers for Windows, macOS and Linux and publishes them to a draft
# GitHub release.
#
# Run on request rather than on every tag, because releases are normally cut
# locally. See RELEASE.md. electron-builder writes the same `latest.yml` update
# manifest either way, so the auto updater cannot tell the two apart.
#
# To drive releases from tags instead, restore the trigger:
#
#   on:
#     push:
#       tags:
#         - 'v*'
#     workflow_dispatch:
#
# Keep `releaseType: draft` in electron-builder.yml if you do. Three jobs publish
# into one release, and a non draft release goes live the moment the first of
# them finishes, which hands clients a `latest.yml` for an installer that has not
# finished uploading.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing and notarization (optional; leave secrets unset to
          # ship unsigned builds).
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify update manifests
        run: npm run verify:manifest
