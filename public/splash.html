<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/public/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash Screen</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at 20% 20%, #1a4c7b, #0b1624 55%, #060e19 100%);
            color: #e8f1ff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 28px;
            width: 320px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }
        .logo-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 96px;
            height: 96px;
            border-radius: 22px;
            background: rgba(26, 76, 123, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #7cc4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 18px auto 10px;
        }
        .title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }
        .subtitle {
            margin: 6px 0 0;
            font-size: 14px;
            color: rgba(232, 241, 255, 0.75);
        }
        .pill {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(124, 196, 255, 0.12);
            border: 1px solid rgba(124, 196, 255, 0.4);
            color: #7cc4ff;
            font-size: 12px;
            letter-spacing: 0.4px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="logo192.png" alt="SysPeek" width="64" height="64" />
        </div>
        <h1 class="title">Launching SysPeek</h1>
        <p class="subtitle">Loading UI and gathering system telemetry…</p>
        <div class="spinner"></div>
        <span class="pill">Hardware-ready</span>
    </div>
</body>
</html>
